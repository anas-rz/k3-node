site_name: K3Node
site_url: https://anas-rz.github.io/k3-node/
repo_url: https://github.com/anas-rz/k3-node
repo_name: anas-rz/k3-node
edit_uri: ""

theme:
  name: material
  logo: images/logo.svg
  favicon: images/logo.svg
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.integrate
    - header.autohide
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono

plugins:
  - search
  - autorefs
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            show_root_heading: true
            show_source: false
            heading_level: 3

nav:
  - Getting Started:
      - Overview: index.md
      - Quickstart: quickstart.md
      - Multi-Backend Guide: backends.md
  - API Reference:
      - Convolution Layers: api/conv.md
      - Aggregation Layers: api/aggr.md
      - Normalization Layers: api/norm.md
      - Pooling Layers: api/pool.md
      - Dense Layers: api/dense.md
      - Knowledge Graph Embeddings: api/kge.md
      - Models: api/models.md
      - Pretrained Foundation Models: api/pretrained.md
      - Graph Data Structures: api/data.md
      - Data Loaders & Samplers: api/loader.md
      - Graph Transforms: api/transforms.md
  - Porting Checklist: checklist.md

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js