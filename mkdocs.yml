site_name: K3Node
site_url: https://anas-rz.github.io/k3-node/
repo_url: https://github.com/anas-rz/k3-node
repo_name: anas-rz/k3-node
edit_uri: ""

theme:
  name: material
  logo: images/logo.png
  favicon: images/logo.png
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.integrate
    - header.autohide
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono

hooks:
  - scripts/mkdocs_hooks.py

plugins:
  - search
  - autorefs
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            show_root_heading: true
            show_source: false
            heading_level: 3

nav:
  - Getting Started:
      - Overview: index.md
      - Quickstart: quickstart.md
      - Multi-Backend Guide: backends.md
  - Examples:
      - Overview: examples/index.md
      - Node Classification: examples/node_classification.md
      - Large-Scale & Scalable Training: examples/large_scale_training.md
      - Inductive Learning: examples/inductive_learning.md
      - Link Prediction: examples/link_prediction.md
      - Knowledge Graphs: examples/knowledge_graphs.md
      - Graph Classification: examples/graph_classification.md
      - Molecular Property Prediction: examples/molecular_property_prediction.md
      - Point Cloud & 3D: examples/point_cloud_3d.md
      - Representation Learning: examples/representation_learning.md
      - Clustering: examples/clustering.md
      - Utilities & Misc: examples/utilities_and_misc.md
  - API Reference:
      - Convolution Layers: api/conv.md
      - Attention Layers: api/attention.md
      - Aggregation Layers: api/aggr.md
      - Normalization Layers: api/norm.md
      - Pooling Layers: api/pool.md
      - Dense Layers: api/dense.md
      - High-Level Task APIs: api/tasks.md
      - Knowledge Graph Embeddings: api/kge.md
      - Models: api/models.md
      - Pretrained Foundation Models: api/pretrained.md
      - Materials & Crystal GNNs: api/materials.md
      - Biological & Macromolecular Models: api/bio.md
      - Graph Data Structures: api/data.md
      - Graph Datasets: api/datasets.md
      - Data Loaders & Samplers: api/loader.md
      - Graph Transforms: api/transforms.md
      - Tabular-to-Graph ETL: api/etl.md
      - Graph Utilities & Ops: api/ops.md
  - Guides:
      - High-Level Task APIs: guides/tasks.md
      - Tabular-to-Graph ETL: guides/etl.md
      - Fine-Tuning Recipes: guides/finetuning.md
  - Porting Checklist: checklist.md

markdown_extensions:
  - md_in_html
  - admonition
  - attr_list
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js