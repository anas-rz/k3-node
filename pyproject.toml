[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "k3-node"
dynamic = ["version"]
description = "Multi-Backend Graph Neural Networks on Keras 3"
readme = "README.md"
requires-python = ">=3.11"  # Keras 3 requires Python >= 3.11
license = { text = "MIT" }
authors = [
    { name = "Muhammad Anas Raza" }
]
dependencies = [
    "keras>=3.0",
    "scipy",
    "pynndescent",
    "sympy",
    "pandas",
    "huggingface_hub>=0.20.0",
    "onnx>=1.15.0",
    "onnxruntime>=1.17.0",
    "tf2onnx>=1.16.0",
    "onnxscript",
]

[project.optional-dependencies]
examples = [
    "scikit-learn",
    "rdflib",
    "matplotlib",
]
test = [
    "pytest>=8.0.0",
    "pytest-cov",
    "torch>=2.0.0",
    "torch-geometric>=2.5.0",
    "networkx",
    "scikit-learn",
    "tqdm",
    "fsspec",
    "requests",
    "onnx>=1.15.0",
    "onnxruntime>=1.17.0",
    "tf2onnx>=1.16.0",
    "onnxscript",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
    "mkdocs-autorefs",
    "pymdown-extensions",
    "mkdocs-jupyter",
    "pygments",
]

[tool.setuptools.packages.find]
include = ["k3_node*"]
exclude = ["docs*", "test*"]


[tool.setuptools.dynamic]
version = {attr = "k3_node.__version__"}