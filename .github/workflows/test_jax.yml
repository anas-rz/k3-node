name: Tests and coverage with JAX Backend

on:
  push:
    paths:
      - 'k3_node/**'
      - '!k3_node/**/*.md'
      - 'conftest.py'
      - 'pytest.ini'
      - 'pyproject.toml'
      - 'requirements*.txt'
      - '.github/workflows/test_jax.yml'
  pull_request:
    paths:
      - 'k3_node/**'
      - '!k3_node/**/*.md'
      - 'conftest.py'
      - 'pytest.ini'
      - 'pyproject.toml'
      - 'requirements*.txt'
      - '.github/workflows/test_jax.yml'
  workflow_dispatch:

concurrency:
  group: test-jax-${{ github.ref }}
  cancel-in-progress: true

env:
  KERAS_BACKEND: jax

jobs:
  build:

    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Keras 3 currently requires Python >= 3.11.
        python-version: ["3.11", "3.13"]
        os: [ubuntu-latest]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
    - name: Setup utilities
      run: |
        python -m pip install --upgrade pip
        python -m pip install pytest coverage codecov
    - name: Install dependencies
      run: |
        pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements-test.txt
        pip install --upgrade "jax[cpu]"
        pip install -e .

    - name: Unit tests
      run: |
        python -m coverage run --source=k3_node -m pytest
    - name: Coverage report
      run: |
        python -m coverage xml
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
