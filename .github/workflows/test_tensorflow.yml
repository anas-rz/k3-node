name: Tests and coverage with TensorFlow Backend

on:
  push:
    paths:
      - 'k3_node/**'
      - '!k3_node/**/*.md'
      - 'conftest.py'
      - 'pyproject.toml'
      - 'requirements*.txt'
      - '.github/workflows/test_tensorflow.yml'
  pull_request:
    paths:
      - 'k3_node/**'
      - '!k3_node/**/*.md'
      - 'conftest.py'
      - 'pyproject.toml'
      - 'requirements*.txt'
      - '.github/workflows/test_tensorflow.yml'
  workflow_dispatch:

env:
  KERAS_BACKEND: tensorflow

jobs:
  build:

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: ["3.9"]
        os: [ubuntu-latest]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
    - name: Setup utilities
      run: |
        python -m pip install --upgrade pip
        python -m pip install pytest coverage codecov
    - name: Install dependencies
      run: |
        pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements-test.txt
        pip install -e .

    - name: Test with pytest and coverage
      run: |
        python -m coverage run --source=. -m pytest
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4